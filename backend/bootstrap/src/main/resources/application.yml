spring:
  application:
    name: urgence-sante
  profiles:
    default: local

  # Source de données PostgreSQL/PostGIS. Aucune valeur sensible n'est écrite
  # ici : tout provient de variables d'environnement (mot de passe sans défaut).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urgence_sante}
    username: ${DB_USER:urgence_sante}
    password: ${DB_PASSWORD:}
    # Explicites plutôt que les défauts implicites de Hikari (issue #138) :
    # base dédiée à cette seule API (deploy/docker-compose.yml, conteneur
    # non partagé), sur un VPS modeste hébergeant d'autres projets — un
    # pool volontairement restreint (le défaut Hikari, mais assumé plutôt
    # qu'implicite), cohérent avec server.tomcat.threads.max ci-dessous et
    # avec la disponibilité désormais chargée en UN accès groupé par
    # orientation (issue #127), plus jusqu'à 30.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # Sous saturation, échouer vite (503) plutôt que de faire attendre un
      # client 30 s (défaut Hikari) avant de découvrir qu'aucune connexion
      # n'est disponible.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:2500}

  # Migrations versionnées : Flyway initialise et fait évoluer le schéma.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # open-in-view=true (défaut Spring Boot) garde la session Hibernate ouverte
  # jusqu'au rendu de la réponse : un accès paresseux oublié dans un mappeur
  # web recharge alors silencieusement depuis la base HORS transaction, hors
  # du pool dimensionné ci-dessus. Désactivé : tout accès aux données doit
  # être explicite et borné par la couche application — déjà le cas ici
  # (architecture hexagonale : repositories/adapters mappent vers des DTOs
  # DANS la transaction, jamais d'entité JPA exposée à la couche web).
  jpa:
    open-in-view: false

# CORS : aucune origine autorisée par défaut. Liste séparée par des virgules,
# fournie par l'environnement (ex. démo web). Les motifs génériques (« * »)
# sont refusés au démarrage en profil production.
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:}

# En production, nginx (deploy/setup-domaine.sh) est un reverse-proxy DEVANT
# l'API : sans ceci, HttpServletRequest#getRemoteAddr() renvoie l'IP du proxy
# pour TOUT le monde -> un seul seau de débit global au lieu d'un seau par
# client (issue #135). NATIVE active le RemoteIpValve intégré à Tomcat, qui ne
# fait confiance à l'en-tête X-Forwarded-For QUE si le pair TCP immédiat
# correspond à `internal-proxies` — jamais à un client public direct (celui-ci
# ne peut donc pas usurper l'IP d'un tiers pour vider son seau de débit).
# Commun à tous les profils : sans proxy devant l'API (dev local, tests), sans
# en-tête X-Forwarded-For entrant, le comportement est inchangé.
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Liste blanche EXPLICITE (reprend le motif standard des plages privées
      # de Tomcat, documenté ici plutôt que laissé implicite) : loopback (le
      # nginx du VPS et le client HTTP des tests s'y connectent en boucle
      # locale), pont Docker 172.16-31.x/12 (deploy/docker-compose.yml publie
      # l'API via `ports: 8086:8090`, nginx tournant sur l'hôte), 10.x/192.168.x
      # en cas d'évolution du déploiement. Jamais une IP publique.
      internal-proxies: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]{1}\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]{1}\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]{1}\\.\\d{1,3}\\.\\d{1,3}"
    threads:
      # Le défaut Spring Boot (200) est dimensionné pour un serveur dédié :
      # hors de propos sur ce VPS partagé (mem_limit 1,5 Go sur le conteneur
      # API, cf. deploy/docker-compose.yml, "héberge d'autres projets"),
      # démesuré pour le trafic réel (démo, 15 établissements). Réduit à une
      # valeur assumée, confortable au-delà de la concurrence attendue —
      # issue #138 : un défaut implicite masquait ce choix de dimensionnement.
      max: ${TOMCAT_THREADS_MAX:50}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}

# Santé et métriques.
# - liveness : le processus est démarré ;
# - readiness : PRÊT à servir — inclut la base de données ;
# - osrm : signalé à part (DEGRADED n'empêche pas de servir : mode dégradé).
management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      # Groupes de santé (chemin exact : management.endpoint.health.group.*).
      group:
        readiness:
          # La readiness inclut la base : une base indisponible la fait tomber.
          include: readinessState,db
          # Composants visibles (db notamment) : un opérateur/un test voit CE
          # QUI rend l'application prête ou non.
          show-components: always

# Corrélation dans chaque ligne de log (X-Correlation-Id propagé ou généré).
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:-},%X{correlationId:-}] %logger{36} : %msg%n"

# Documentation d'API — Swagger UI (contract-first).
# La source de vérité est le contrat écrit à la main (docs/api/openapi.yaml),
# copié en ressource statique et servi sur /openapi.yaml. Swagger UI charge CE
# contrat (springdoc.swagger-ui.url) au lieu d'une spec générée depuis le code,
# de sorte que la doc exposée est TOUJOURS identique au contrat officiel.
# NB : api-docs reste actif (springdoc monte son contrôleur Swagger UI à cette
# condition) mais sa spec auto-générée n'est jamais affichée — l'UI pointe le
# contrat statique.
springdoc:
  swagger-ui:
    # Interface accessible sur http://<hôte>/swagger-ui/index.html
    # Charge le contrat statique plutôt qu'une spec auto-générée.
    url: /openapi.yaml
    # Une seule spec (le contrat) : pas de sélecteur d'URL par défaut.
    disable-swagger-default-url: true

# ============================================================================
# Profil LOCAL — développement sur le poste, et rien d'autre.
#
# Objectif : `java -jar bootstrap-…-exec.jar` démarre SANS variable
# d'environnement (voir COMMANDES.md à la racine). Chaque valeur reste
# surchargeable par la variable habituelle, et un application-local.yml
# personnel (volontairement NON versionné, voir .gitignore) prime encore
# sur ce bloc. La production n'hérite de rien.
# ============================================================================
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # Aligné sur infrastructure/docker-compose.yml + .env.example :
    # PostGIS local exposé sur 55432, mot de passe de développement.
    #
    # Défaut en dur INTENTIONNEL (audit P3 #140) : ce bloc n'active QUE le
    # profil local (spring.config.activate.on-profile: local ci-dessus), sur
    # un PostGIS qui n'écoute que sur cette machine de développement — jamais
    # exposé au réseau, jamais la base réelle. La production n'active jamais
    # ce profil et n'hérite de RIEN d'ici : son mot de passe reste le
    # ${DB_PASSWORD:} sans défaut de la section spring.datasource racine
    # ci-dessus (ligne 12), qui échoue au démarrage si absent — donc pas de
    # secret de production accessible en clair dans ce fichier versionné.
    # Retirer ce défaut casserait le confort explicitement visé par ce fichier
    # (« java -jar … démarre SANS variable d'environnement », voir en-tête)
    # sans gain de sécurité réel.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:urgence_sante}
    password: ${DB_PASSWORD:dev_local_pwd}
  flyway:
    # Ajoute le jeu de données local (15 établissements DEMO) aux migrations :
    # base utilisable dès le démarrage, sans script. `db/local-seed` n'est
    # référencé QUE par ce profil ; en production, DemoDataProductionGuard
    # refuse de toute façon les données DEMO (défense en profondeur).
    locations: classpath:db/migration,classpath:db/local-seed

# Port attendu par les applications Flutter (app_config.dart : localhost:8090)
# et par la documentation locale.
server:
  port: ${SERVER_PORT:8090}

# Le portail Flutter Web tourne sur un port local aléatoire : on autorise
# localhost/127.0.0.1 (motifs interdits en production par CorsPolicy).
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Rayon de recherche élargi : le poste de test peut être loin d'Abidjan (où
# vivent les données DEMO) ; 15 km n'y trouverait rien. Produit : 15 km.
orientation:
  default-radius-meters: ${ORIENTATION_DEFAULT_RADIUS_METERS:100000}

# Serveur de démonstration public OSRM : SANS SLA, throttlé — acceptable
# UNIQUEMENT en local (issue #126). `routing.osrm.base-url` n'a AUCUN défaut
# hors de ce profil (RoutingConfiguration) : la production DOIT fournir sa
# propre valeur (auto-hébergement ou hôte de production).
routing:
  osrm:
    base-url: https://router.project-osrm.org
